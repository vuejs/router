name: Detect test changes

on:
  workflow_call:
    outputs:
      run-tests:
        description: Whether changes need unit and end-to-end tests
        value: ${{ jobs.changes.outputs.run-tests }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run-tests: ${{ steps.diff.outputs.run-tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # HEAD is the PR merge commit, the merge group head, or the pushed commit.
      # A missing base fails git diff, so tests run.
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- \
            ':!packages/docs' \
            ':!packages/playground' \
            ':!packages/playground-file-based' \
            ':!packages/experiments-playground'; then
            echo 'run-tests=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run-tests=true' >> "$GITHUB_OUTPUT"
          fi
