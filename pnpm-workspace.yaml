packages:
  - 'packages/*'

shamefullyHoist: true

overrides:
  '@babel/generator': '^8.0.0'
  '@babel/types': '^8.0.0'
  '@types/node': '^24.10.4'
  '@vue/compiler-sfc': '^3.6.0-beta.10'
  '@vue/runtime-dom': '^3.6.0-beta.10'
  '@vue/server-renderer': '^3.6.0-beta.10'
  'vite': '^8.2.0'
  'vue': '^3.6.0-beta.10'

peerDependencyRules:
  ignoreMissing:
    - react
    - react-dom
    - '@types/react'

allowBuilds:
  chromedriver: true
  esbuild: true
  geckodriver: true
  simple-git-hooks: true
  '@nightwatch/nightwatch-inspector': false
detect_chromedriver_version: true
